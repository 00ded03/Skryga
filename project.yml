name: Skryga
options:
  bundleIdPrefix: com.skryga
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: Skryga
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Skryga:
    type: application
    platform: iOS
    bundleId: com.skryga.app
    deploymentTarget: "17.0"
    sources:
      - path: Skryga
    info:
      path: Skryga/App/Info.plist
      properties:
        CFBundleDisplayName: Skryga
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: com.skryga.app
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: "Используется для сканирования чеков и извлечения данных о транзакциях."
        NSPhotoLibraryUsageDescription: "Используется для выбора фото чеков из галереи."
        NSPhotoLibraryAddUsageDescription: "Используется для сохранения отсканированных чеков."
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

    entitlements:
      path: Skryga/App/Skryga.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.skryga.app
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        com.apple.developer.cloudkit.environment: production
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.skryga.app

    dependencies:
      - framework: SwiftData.framework
        weak: false
      - framework: Charts.framework
        weak: false
      - framework: Vision.framework
        weak: false
      - framework: UserNotifications.framework
        weak: false
      - framework: CloudKit.framework
        weak: false
      - framework: CoreData.framework
        weak: false

    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: Skryga/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Skryga/App/Skryga.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

schemes:
  Skryga:
    build:
      targets:
        Skryga: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
